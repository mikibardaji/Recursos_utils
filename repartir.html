<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<title>Repartidor d'Alumnes amb Opció de No Mostrar Professor</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f4f6f8;
  }
  h1 {
    text-align: center;
  }
  button {
    padding: 8px 14px;
    margin: 10px 0;
    cursor: pointer;
  }
  input, textarea, select, label {
    padding: 6px;
    margin: 5px 0;
    width: 100%;
  }
  .aula {
    margin-top: 60px;
    text-align: center;
  }
  .grid-aula {
    display: grid;
    gap: 15px 15px;
    justify-content: center;
  }
  .professor {
    border: 3px solid black;
    background: #ffe082;
    padding: 15px 30px;
    font-weight: bold;
    min-width: 120px;
    text-align: center;
  }
  .ordinador {
    border: 2px solid #333;
    padding: 10px;
    width: 120px;
    min-height: 60px;
    background-color: white;
    text-align: center;
    font-weight: bold;
  }
  .buit {
    background-color: #ddd;
    color: #777;
  }
</style>
</head>
<body>

<h1>Repartidor d'Alumnes</h1>

<div id="configuracio">
  <label>Quantes files té l'aula?</label>
  <input type="number" id="numFiles" min="1" />
  <button onclick="crearFiles()">Continuar</button>
</div>

<div id="filesConfig"></div>

<div id="opcionsConfig" style="display:none;">
  <label>Disposició visual:</label>
  <select id="orientacio">
    <option value="horizontal">Horitzontal</option>
    <option value="vertical">Vertical</option>
  </select>

  <label>On vols situar el professor?</label>
  <select id="posicioProfessor">
    <option value="esquerra">Esquerra</option>
    <option value="centre">Centre</option>
    <option value="dreta">Dreta</option>
  </select>

  <label>
    <input type="checkbox" id="noMostrarProfessor">
    No mostrar professor
  </label>
</div>

<div id="alumnesConfig" style="display:none;">
  <h3>Llistat d'alumnes</h3>
  <textarea id="llistaAlumnes" rows="6"></textarea>
  <button onclick="repartir()">Repartir alumnes</button>
</div>

<hr />
<div id="aulaVisual" class="aula"></div>

<script>
let configuracioFiles = [];

function crearFiles() {
  const num = parseInt(document.getElementById("numFiles").value);
  const container = document.getElementById("filesConfig");
  container.innerHTML = "";
  for (let i = 0; i < num; i++) {
    container.innerHTML += `
      <label>Ordinadors a la fila ${i + 1}:</label>
      <input type="number" min="1" />
    `;
  }
  container.innerHTML += `<button onclick="guardarConfiguracio()">Guardar configuració</button>`;
}

function guardarConfiguracio() {
  const inputs = document.querySelectorAll("#filesConfig input");
  configuracioFiles = [];
  inputs.forEach((input) => configuracioFiles.push(parseInt(input.value)));
  document.getElementById("opcionsConfig").style.display = "block";
  document.getElementById("alumnesConfig").style.display = "block";
}

function repartir() {
  const text = document.getElementById("llistaAlumnes").value;
  const orientacio = document.getElementById("orientacio").value;
  const posicio = document.getElementById("posicioProfessor").value;
  const noMostrar = document.getElementById("noMostrarProfessor").checked;

  let alumnes = text
    .split(/[\n,]+/)
    .map((a) => a.trim())
    .filter((a) => a.length > 0);

  barrejar(alumnes);

  const aula = document.getElementById("aulaVisual");
  aula.innerHTML = "";

  if (orientacio === "horizontal") {
    const maxOrdinadors = Math.max(...configuracioFiles);
    const colTotal = maxOrdinadors + 1;

    const grid = document.createElement("div");
    grid.className = "grid-aula";
    grid.style.gridTemplateRows = `repeat(${configuracioFiles.length}, auto)`;
    grid.style.gridTemplateColumns = `130px repeat(${maxOrdinadors}, 130px)`;
    grid.style.alignItems = "start";

    let alumnesIndex = 0;

    let filaProfessor;
    if (!noMostrar) {
      if (posicio === "esquerra") filaProfessor = configuracioFiles.length - 1;
      else if (posicio === "dreta") filaProfessor = 0;
      else filaProfessor = Math.floor(configuracioFiles.length / 2);
    }

    for (let fila = 0; fila < configuracioFiles.length; fila++) {
      if (!noMostrar && fila === filaProfessor) {
        const prof = document.createElement("div");
        prof.className = "professor";
        prof.textContent = "Professor";
        prof.style.gridRow = fila + 1;
        prof.style.gridColumn = 1;
        grid.appendChild(prof);
      } else {
        const buida = document.createElement("div");
        buida.style.gridRow = fila + 1;
        buida.style.gridColumn = 1;
        grid.appendChild(buida);
      }

      const numOrdinadors = configuracioFiles[fila];
      for (let col = 0; col < numOrdinadors; col++) {
        const ord = crearOrdinador(alumnes, alumnesIndex++);
        ord.style.gridRow = fila + 1;
        ord.style.gridColumn = col + 2;
        grid.appendChild(ord);
      }
    }
    aula.appendChild(grid);

  } else {
    // Vertical: columnes = files + opcions de professor a primera fila
    const maxOrdinadors = Math.max(...configuracioFiles);
    const numFiles = configuracioFiles.length;

    const grid = document.createElement("div");
    grid.className = "grid-aula";
    // fila 1 per al professor o buida, després files d’ordinadors
    grid.style.gridTemplateRows = `auto repeat(${maxOrdinadors}, auto)`;
    grid.style.gridTemplateColumns = `repeat(${numFiles}, 130px)`;
    grid.style.alignItems = "start";

    let alumnesIndex = 0;

    if (!noMostrar) {
      let colProfessor;
      if (posicio === "esquerra") colProfessor = 1;
      else if (posicio === "dreta") colProfessor = numFiles;
      else colProfessor = Math.ceil(numFiles / 2);

      const prof = document.createElement("div");
      prof.className = "professor";
      prof.textContent = "Professor";
      prof.style.gridRow = 1;
      prof.style.gridColumn = colProfessor;
      grid.appendChild(prof);
    }

    // omplir ordinadors a partir de fila 2
    for (let col = 0; col < numFiles; col++) {
      const numOrdinadorsFila = configuracioFiles[col];
      for (let filaOrd = 0; filaOrd < numOrdinadorsFila; filaOrd++) {
        const ord = crearOrdinador(alumnes, alumnesIndex++);
        ord.style.gridRow = filaOrd + 2;
        ord.style.gridColumn = col + 1;
        grid.appendChild(ord);
      }
    }
    aula.appendChild(grid);
  }
}

function crearOrdinador(alumnes, index) {
  const div = document.createElement("div");
  div.className = "ordinador";
  if (index < alumnes.length) {
    div.textContent = alumnes[index];
  } else {
    div.textContent = "Buit";
    div.classList.add("buit");
  }
  return div;
}

function barrejar(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}
</script>

</body>
</html>
